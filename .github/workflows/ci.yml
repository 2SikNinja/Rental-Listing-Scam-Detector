# =====================================================================
# Continuous integration and deployment
#
# Runs on every push to master and every pull request. Three check jobs
# run in parallel; any failure marks the commit with a red X on GitHub.
#   api     - Python tests (pytest)
#   web     - TypeScript type check, lint, and production build
#   docker  - builds the API image and checks the container starts
#
# Then, only for pushes to master where all three passed:
#   deploy  - builds the API image, pushes it to Artifact Registry, and
#             releases it on Cloud Run. The website deploys separately
#             through Vercel's GitHub integration.
# =====================================================================

name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: jobs only read the code unless they ask for more.
permissions:
  contents: read

# Pushing twice to a pull request cancels the older run. On master, runs
# are never cancelled, so a deploy is never stopped halfway through.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # A throwaway Postgres for the integration tests. It only exists for
    # this job and has nothing to do with the real Supabase database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: scamtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: ci-only-password
      TEST_API_DATABASE_URL: postgresql://scam_api:ci-api-password@localhost:5432/scamtest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install Python and dependencies
        # --frozen fails if uv.lock is out of date, so CI uses exactly the locked versions
        run: uv sync --frozen

      - name: Apply database migrations to the test database
        # Runs the same migration files as production, in order, after a
        # small stub for the Supabase-only pieces they reference.
        run: |
          adminUrl="postgresql://owner@localhost:5432/scamtest"
          psql "$adminUrl" -q -v ON_ERROR_STOP=1 -f tests/integration/supabaseStub.sql
          for migrationFile in ../../supabase/migrations/*.sql; do
            echo "Applying $migrationFile"
            psql "$adminUrl" -q -v ON_ERROR_STOP=1 -f "$migrationFile"
          done
          psql "$adminUrl" -q -c "alter role scam_api with login password 'ci-api-password'"

      - name: Run tests (unit and database integration)
        run: uv run pytest -q

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate route types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t rental-scam-api apps/api

      - name: Start container and check /health
        # Fake values only: real secrets never go in CI logs or the image.
        run: |
          docker run -d --name api -p 8080:8080 \
            -e APP_ENV=test \
            -e DATABASE_URL=postgresql://ci:ci@localhost:5432/ci \
            -e SUPABASE_URL=http://localhost:54321 \
            -e CONTACT_HASH_SECRET=$(printf 'a%.0s' $(seq 1 64)) \
            rental-scam-api
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:8080/health; then
              echo
              echo "Container is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become healthy. Logs:"
          docker logs api
          exit 1

  deploy:
    name: Deploy API to Cloud Run
    needs: [api, web, docker]
    # Only real pushes to master, and only once the Google Cloud setup
    # (scripts/setupGithubDeploy.ps1) has been done and its values saved
    # as repository variables. Until then this job is skipped, not failed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write  # lets the job request a GitHub identity token for Google
    env:
      REGION: us-west1
      SERVICE: rental-scam-api
      IMAGE: us-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cloud-run-source-deploy/rental-scam-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Google Cloud (Workload Identity Federation, no stored keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        # Tagged with the commit SHA, so every release maps to exact code
        run: |
          gcloud auth configure-docker us-west1-docker.pkg.dev --quiet
          docker build -t "$IMAGE" apps/api
          docker push "$IMAGE"

      - name: Release on Cloud Run
        # Keeps the service's existing settings: env vars, secrets,
        # service account, memory, and instance limits.
        run: gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" --quiet

      - name: Check the live service is healthy
        run: |
          serviceUrl=$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')
          for attempt in $(seq 1 10); do
            if curl -fsS "$serviceUrl/health"; then
              echo
              echo "Deployed and healthy: $serviceUrl"
              exit 0
            fi
            sleep 3
          done
          echo "Deployed revision is not responding on /health"
          exit 1
